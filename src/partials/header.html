<header class="hdr" data-header>
  <div class="wrap nav">
    <a class="logo" href="/" aria-label="SecurBank home">
      {{> logo w=103 h=36}}
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="#">Accounts</a>
      <a href="/credit-cards/"{{{navCards}}}>Credit cards</a>
      <a href="#">Loans</a>
      <a href="#">Insurance</a>
    </nav>
    <div class="nav-utils">
      <button type="button" class="icon-btn" aria-label="Search" aria-expanded="false" aria-controls="sb-search" data-search-toggle>
        <svg data-icon-closed width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <svg data-icon-open hidden width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      {{> lang}}
    </div>
    <div class="nav-account">
      <a class="login" href="#">Log in</a>
    </div>
    <button type="button" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="sb-menu" data-menu-toggle>
      <svg data-icon-closed width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg data-icon-open hidden width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="mobile-menu" id="sb-menu" aria-label="Main" hidden>
    <div class="wrap">
      <ul>
        <li><a href="#">Accounts<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></li>
        <li><a href="/credit-cards/"{{{navCards}}}>Credit cards<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></li>
        <li><a href="#">Loans<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></li>
        <li><a href="#">Insurance<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></li>
      </ul>
    </div>
  </nav>

  <div class="search-panel" id="sb-search" hidden>
    <div class="wrap search-inner">
      <form class="search-form" role="search" action="#" data-search-form>
        <label for="sb-q" class="sr">Search SecurBank</label>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="sb-q" name="q" type="search" placeholder="Search cards, accounts, loans and help" autocomplete="off" aria-controls="sb-results" aria-describedby="sb-status">
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <div class="search-sugg" data-search-popular>
        <span>Popular</span>
        <a href="/credit-cards/">Credit cards</a>
        <a href="/credit-cards/cashback/">Cashback card</a>
        <a href="/#mortgage-calculator">Mortgage calculator</a>
        <a href="/credit-cards/#eligibility">Check eligibility</a>
        <a href="#">Open an account</a>
      </div>
      <ul class="results" id="sb-results" aria-label="Search results" hidden></ul>
      <p class="noresults" data-search-empty hidden></p>
      <p class="sr" id="sb-status" aria-live="polite"></p>
    </div>
  </div>
</header>
